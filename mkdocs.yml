site_name: Ascend-FFT
site_description: Parameterized hybrid-dataflow FFT operators on Huawei Ascend
site_url: https://truncat3.github.io/ascend-fft/
repo_url: https://github.com/TruNcat3/ascend-fft
repo_name: TruNcat3/ascend-fft
edit_uri: edit/master/docs/
exclude_docs: |
  README.md
  Cube张量化探针.md
  matrix_test_a7.md
  matrix_test_raw.md
  trace与profile诊断-小尺寸与大尺寸.md
  实数变换-r2c与c2r.md
  实验对比.md
  性能优化-C2b与K择优.md
  性能对比-标准库vs自研.md
  矩阵测试与GPU绝对性能对比.md
  设计思路与演进.md
  阶段0-1-发现与结果.md
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
extra_css:
  - stylesheets/extra.css
plugins:
  - search:
      lang: [zh, en]
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
nav:
  - 阅读入口: index.md
  - 开始使用:
      - 安装: getting-started/installation.md
      - 首次运行: getting-started/quickstart.md
      - 故障排查: reference/troubleshooting.md
  - 使用指南:
      - 变换契约: user-guide/transforms.md
      - 计划与选型: user-guide/plans.md
      - API: reference/api.md
  - 设计分析:
      - 为什么混合展开: design/motivation.md
      - 架构与数据流: design/architecture.md
      - 计算核心与硬件映射: design/kernels.md
      - 性能模型: design/performance-model.md
      - 实数变换: design/real-transforms.md
  - 实验与结果:
      - 测量方法: benchmarks/methodology.md
      - 测试策略与扩展矩阵: testing.md
      - 长 FFT 目的化实验计划: benchmarks/long-fft-plan.md
      - 长 FFT 预声明数据表: generated/long-fft-tables.md
      - 长 FFT 验收证据: generated/long-fft-evidence.md
      - 长 FFT 同尺寸基线: generated/long-fft-baseline.md
      - 当前结果: benchmarks/results.md
      - 复现实验: benchmarks/reproducibility.md
      - 相关工作与基线: benchmarks/related-work.md
      - C2C 发布矩阵: generated/matrix.md
      - 多基线发布明细: generated/comparison.md
  - 开发指南:
      - 工程结构: development/repository-layout.md
      - 性能诊断: development/profiling.md
      - 新增设计点: development/adding-design-points.md
      - 验证与发布: development/validation-and-release.md
  - 参考:
      - 配置: reference/configuration.md
      - 支持范围: reference/support.md
      - 术语: reference/glossary.md
  - 未来计划与验收: roadmap.md
  - 项目与作者: about.md
  - 历史归档:
      - 演进与优化决策: archive/decisions.md
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: info
copyright: >-
  Copyright &copy; 2026 Teng Wang · High Efficient Intelligent Computing Lab ·
  Suzhou Institute for Advanced Research, USTC
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TruNcat3
      name: Teng Wang on GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:wangt635@ustc.edu.cn
      name: Email Teng Wang
    - icon: fontawesome/solid/building-columns
      link: https://sz.ustc.edu.cn/en/index.html
      name: Suzhou Institute for Advanced Research, USTC
