<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Eight-point FFT example of four space-time mapping factors</title>
  <desc id="desc">A concrete eight-point FFT shows independent butterfly work within a stage and dependencies across stages. Four examples distinguish data-space, data-time, stage-space and stage-time mapping.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#425466"/></marker><style>.t{font:700 27px Inter,Segoe UI,Arial,sans-serif;fill:#17212b}.h{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#17212b}.b{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#334155}.s{font:12px Inter,Segoe UI,Arial,sans-serif;fill:#52606d}.n{fill:#fff;stroke:#2374ab;stroke-width:2}.g{stroke:#6b7c93;stroke-width:1.4;fill:none}.e{stroke:#425466;stroke-width:2;fill:none;marker-end:url(#a)}.tag{font:700 12px Inter,Segoe UI,Arial,sans-serif}</style></defs>
  <rect width="1200" height="720" rx="16" fill="#f8fafc"/><text x="48" y="48" class="t">A concrete N=8 FFT: what Ud, Td, Us and Ts change</text><text x="48" y="76" class="b">The factors describe resource replication and reuse. They do not fix the tile size, radix or physical core.</text>
  <rect x="45" y="105" width="500" height="550" rx="12" fill="#eaf3fb" stroke="#2374ab" stroke-width="2"/><text x="67" y="140" class="h">Logical dependency graph</text><text x="67" y="164" class="b">stage-space points right; data groups run vertically</text>
  <text x="145" y="199" class="s">input</text><text x="248" y="199" class="s">s0 · d=1</text><text x="363" y="199" class="s">s1 · d=2</text><text x="468" y="199" class="s">s2 · d=4</text>
  <g class="g" opacity="0.78"><path d="M150 230L255 230M150 230L255 275M150 275L255 230M150 275L255 275M150 320L255 320M150 320L255 365M150 365L255 320M150 365L255 365M150 410L255 410M150 410L255 455M150 455L255 410M150 455L255 455M150 500L255 500M150 500L255 545M150 545L255 500M150 545L255 545"/><path d="M255 230L360 230M255 230L360 320M255 320L360 230M255 320L360 320M255 275L360 275M255 275L360 365M255 365L360 275M255 365L360 365M255 410L360 410M255 410L360 500M255 500L360 410M255 500L360 500M255 455L360 455M255 455L360 545M255 545L360 455M255 545L360 545"/><path d="M360 230L465 230M360 230L465 410M360 410L465 230M360 410L465 410M360 275L465 275M360 275L465 455M360 455L465 275M360 455L465 455M360 320L465 320M360 320L465 500M360 500L465 320M360 500L465 500M360 365L465 365M360 365L465 545M360 545L465 365M360 545L465 545"/></g>
  <g class="n"><circle cx="150" cy="230" r="6"/><circle cx="150" cy="275" r="6"/><circle cx="150" cy="320" r="6"/><circle cx="150" cy="365" r="6"/><circle cx="150" cy="410" r="6"/><circle cx="150" cy="455" r="6"/><circle cx="150" cy="500" r="6"/><circle cx="150" cy="545" r="6"/><circle cx="255" cy="230" r="6"/><circle cx="255" cy="275" r="6"/><circle cx="255" cy="320" r="6"/><circle cx="255" cy="365" r="6"/><circle cx="255" cy="410" r="6"/><circle cx="255" cy="455" r="6"/><circle cx="255" cy="500" r="6"/><circle cx="255" cy="545" r="6"/><circle cx="360" cy="230" r="6"/><circle cx="360" cy="275" r="6"/><circle cx="360" cy="320" r="6"/><circle cx="360" cy="365" r="6"/><circle cx="360" cy="410" r="6"/><circle cx="360" cy="455" r="6"/><circle cx="360" cy="500" r="6"/><circle cx="360" cy="545" r="6"/><circle cx="465" cy="230" r="6"/><circle cx="465" cy="275" r="6"/><circle cx="465" cy="320" r="6"/><circle cx="465" cy="365" r="6"/><circle cx="465" cy="410" r="6"/><circle cx="465" cy="455" r="6"/><circle cx="465" cy="500" r="6"/><circle cx="465" cy="545" r="6"/></g>
  <rect x="88" y="575" width="410" height="51" rx="8" fill="#fff" stroke="#8bb5d5"/><text x="108" y="597" class="b">same stage: independent butterfly groups</text><text x="108" y="617" class="b">next stage: prescribed partner dependency</text>
  <rect x="575" y="105" width="580" height="550" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="597" y="140" class="h">Four mappings of the same graph</text>
  <rect x="600" y="173" width="255" height="190" rx="10" fill="#edf7ed" stroke="#3b7d44"/><text x="620" y="203" class="h">Ud = 2 · data space</text><text x="620" y="226" class="b">replicate independent workers</text><rect x="625" y="253" width="82" height="54" rx="7" fill="#fff" stroke="#3b7d44"/><text x="645" y="276" class="b">AIV 0</text><text x="642" y="296" class="s">batch b0</text><rect x="745" y="253" width="82" height="54" rx="7" fill="#fff" stroke="#3b7d44"/><text x="765" y="276" class="b">AIV 1</text><text x="762" y="296" class="s">batch b1</text><text x="620" y="338" class="s">no dependency between transforms</text>
  <rect x="875" y="173" width="255" height="190" rx="10" fill="#fff4df" stroke="#c58b22"/><text x="895" y="203" class="h">Td = 2 · data time</text><text x="895" y="226" class="b">reuse one worker over data</text><rect x="900" y="253" width="70" height="54" rx="7" fill="#fff" stroke="#c58b22"/><text x="918" y="276" class="b">AIV 0</text><text x="919" y="296" class="s">b0</text><path d="M970 280H1010" class="e"/><rect x="1017" y="253" width="70" height="54" rx="7" fill="#fff" stroke="#c58b22"/><text x="1035" y="276" class="b">same</text><text x="1037" y="296" class="s">b1</text><text x="895" y="338" class="s">amortizes setup; adds steady work</text>
  <rect x="600" y="389" width="255" height="230" rx="10" fill="#f2ecf8" stroke="#7750a3"/><text x="620" y="419" class="h">Us = 2 · stage space</text><text x="620" y="442" class="b">replicate stage service roles</text><rect x="625" y="469" width="82" height="54" rx="7" fill="#fff" stroke="#7750a3"/><text x="643" y="492" class="b">role 0</text><text x="646" y="512" class="s">stage s0</text><path d="M707 496H745" class="e"/><rect x="752" y="469" width="82" height="54" rx="7" fill="#fff" stroke="#7750a3"/><text x="770" y="492" class="b">role 1</text><text x="773" y="512" class="s">stage s1</text><text x="620" y="552" class="s">requires transport + readiness</text><text x="620" y="576" class="tag" fill="#8a3030">cross-AIV role pipeline is not production</text>
  <rect x="875" y="389" width="255" height="230" rx="10" fill="#eaf3fb" stroke="#2374ab"/><text x="895" y="419" class="h">Ts = 3 · stage time</text><text x="895" y="442" class="b">reuse service while state resides</text><rect x="900" y="469" width="56" height="54" rx="7" fill="#fff" stroke="#2374ab"/><text x="920" y="501" class="b">s0</text><path d="M956 496H976" class="e"/><rect x="983" y="469" width="56" height="54" rx="7" fill="#fff" stroke="#2374ab"/><text x="1003" y="501" class="b">s1</text><path d="M1039 496H1059" class="e"/><rect x="1066" y="469" width="46" height="54" rx="7" fill="#fff" stroke="#2374ab"/><text x="1078" y="501" class="b">s2</text><text x="895" y="552" class="s">current short path keeps stages in UB</text><text x="895" y="576" class="tag" fill="#235c2c">state capacity bounds the factor</text>
  <text x="48" y="690" class="s">Current status: data-space/time mapping and single-AIV UB-resident stage-time reuse are implemented. Us needs an explicit physical handoff before it can be claimed.</text>
</svg>
