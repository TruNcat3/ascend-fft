<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#465466"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #1f2937; }
      .label { font: 700 16px Arial, sans-serif; fill: #1f2937; }
      .body { font: 14px Arial, sans-serif; fill: #334155; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .data { fill: #e8f2ff; stroke: #3478c9; stroke-width: 2; }
      .kernel { fill: #e8f6ee; stroke: #31805a; stroke-width: 2; }
      .tw { fill: #fff1df; stroke: #d9822b; stroke-width: 2; }
      .fused { fill: #f1eaff; stroke: #7856b8; stroke-width: 2; }
      .arrow { stroke: #465466; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .brace { stroke: #7856b8; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="390" fill="#ffffff"/>
  <text x="600" y="35" text-anchor="middle" class="title">Long-FFT boundary detail: separate versus fused twiddle</text>
  <text x="62" y="83" class="label">Separate (6 launches)</text>
  <rect x="62" y="108" width="130" height="58" rx="7" class="data"/><text x="127" y="142" text-anchor="middle" class="body">transpose in</text>
  <line x1="192" y1="137" x2="220" y2="137" class="arrow"/>
  <rect x="220" y="108" width="100" height="58" rx="7" class="kernel"/><text x="270" y="142" text-anchor="middle" class="body">FFT 1</text>
  <line x1="320" y1="137" x2="348" y2="137" class="arrow"/>
  <rect x="348" y="108" width="115" height="58" rx="7" class="tw"/><text x="405" y="142" text-anchor="middle" class="body">twiddle</text>
  <line x1="463" y1="137" x2="491" y2="137" class="arrow"/>
  <rect x="491" y="108" width="155" height="58" rx="7" class="data"/><text x="568" y="142" text-anchor="middle" class="body">boundary transpose</text>
  <line x1="646" y1="137" x2="674" y2="137" class="arrow"/>
  <rect x="674" y="108" width="100" height="58" rx="7" class="kernel"/><text x="724" y="142" text-anchor="middle" class="body">FFT 2</text>
  <line x1="774" y1="137" x2="802" y2="137" class="arrow"/>
  <rect x="802" y="108" width="130" height="58" rx="7" class="data"/><text x="867" y="142" text-anchor="middle" class="body">transpose out</text>
  <path d="M348,181 v18 h115 v-18" class="brace"/><text x="405" y="220" text-anchor="middle" class="small">extra GM read + write</text>
  <text x="62" y="272" class="label">Fused (5 launches)</text>
  <rect x="62" y="297" width="130" height="58" rx="7" class="data"/><text x="127" y="331" text-anchor="middle" class="body">transpose in</text>
  <line x1="192" y1="326" x2="220" y2="326" class="arrow"/>
  <rect x="220" y="297" width="100" height="58" rx="7" class="kernel"/><text x="270" y="331" text-anchor="middle" class="body">FFT 1</text>
  <line x1="320" y1="326" x2="348" y2="326" class="arrow"/>
  <rect x="348" y="297" width="298" height="58" rx="7" class="fused"/><text x="497" y="323" text-anchor="middle" class="body">boundary transpose + twiddle</text><text x="497" y="343" text-anchor="middle" class="small">twiddle consumed in the input tile</text>
  <line x1="646" y1="326" x2="674" y2="326" class="arrow"/>
  <rect x="674" y="297" width="100" height="58" rx="7" class="kernel"/><text x="724" y="331" text-anchor="middle" class="body">FFT 2</text>
  <line x1="774" y1="326" x2="802" y2="326" class="arrow"/>
  <rect x="802" y="297" width="130" height="58" rx="7" class="data"/><text x="867" y="331" text-anchor="middle" class="body">transpose out</text>
  <text x="1045" y="190" text-anchor="middle" class="small">Same transform semantics</text><text x="1045" y="211" text-anchor="middle" class="small">different boundary organization</text>
</svg>
