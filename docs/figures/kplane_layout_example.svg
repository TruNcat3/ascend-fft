<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative K-plane to planar layout transition</title>
  <desc id="desc">Interleaved complex input is gathered into aligned K-plane real and imaginary groups for local butterflies, then gathered into planar groups for later stages. Layout movement surrounds the replaceable arithmetic core.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#425466"/></marker><style>.t{font:700 27px Inter,Segoe UI,Arial,sans-serif;fill:#17212b}.h{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#17212b}.b{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#334155}.s{font:12px Inter,Segoe UI,Arial,sans-serif;fill:#52606d}.e{stroke:#425466;stroke-width:2;fill:none;marker-end:url(#a)}.r{fill:#eaf3fb;stroke:#2374ab}.i{fill:#f2ecf8;stroke:#7750a3}.cell{stroke-width:1.5}.tag{font:700 12px Inter,Segoe UI,Arial,sans-serif}</style></defs>
  <rect width="1200" height="560" rx="16" fill="#f8fafc"/><text x="48" y="48" class="t">A small layout example: movement and arithmetic are different layers</text><text x="48" y="76" class="b">Illustrative K=4 view; production K is selected from the legal hardware envelope, not fixed by this diagram.</text>
  <rect x="45" y="112" width="300" height="335" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="66" y="145" class="h">1  Interleaved GM input</text><text x="66" y="170" class="b">Re, Im alternate in memory</text>
  <g transform="translate(66 205)"><rect x="0" y="0" width="31" height="50" class="r cell"/><rect x="31" y="0" width="31" height="50" class="i cell"/><rect x="62" y="0" width="31" height="50" class="r cell"/><rect x="93" y="0" width="31" height="50" class="i cell"/><rect x="124" y="0" width="31" height="50" class="r cell"/><rect x="155" y="0" width="31" height="50" class="i cell"/><rect x="186" y="0" width="31" height="50" class="r cell"/><rect x="217" y="0" width="31" height="50" class="i cell"/><text x="6" y="30" class="s">R0</text><text x="37" y="30" class="s">I0</text><text x="68" y="30" class="s">R1</text><text x="99" y="30" class="s">I1</text><text x="130" y="30" class="s">R2</text><text x="161" y="30" class="s">I2</text><text x="192" y="30" class="s">R3</text><text x="223" y="30" class="s">I3</text></g>
  <text x="66" y="293" class="b">small partner distances can violate</text><text x="66" y="316" class="b">the vector-offset alignment contract</text><rect x="66" y="350" width="250" height="62" rx="8" fill="#fbe8e8" stroke="#b34a4a"/><text x="84" y="377" class="h">not a scalar fallback</text><text x="84" y="399" class="s">layout is changed before the core runs</text>
  <path d="M345 280H391" class="e"/><text x="351" y="266" class="s">Gather</text>
  <rect x="398" y="112" width="380" height="335" rx="12" fill="#edf7ed" stroke="#3b7d44" stroke-width="2"/><text x="420" y="145" class="h">2  UB K-plane · aligned local groups</text>
  <g transform="translate(426 191)"><rect x="0" y="0" width="72" height="48" class="r cell"/><rect x="72" y="0" width="72" height="48" class="r cell"/><rect x="144" y="0" width="72" height="48" class="r cell"/><rect x="216" y="0" width="72" height="48" class="r cell"/><text x="24" y="29" class="b">R0</text><text x="96" y="29" class="b">R1</text><text x="168" y="29" class="b">R2</text><text x="240" y="29" class="b">R3</text><rect x="0" y="62" width="72" height="48" class="i cell"/><rect x="72" y="62" width="72" height="48" class="i cell"/><rect x="144" y="62" width="72" height="48" class="i cell"/><rect x="216" y="62" width="72" height="48" class="i cell"/><text x="24" y="91" class="b">I0</text><text x="96" y="91" class="b">I1</text><text x="168" y="91" class="b">I2</text><text x="240" y="91" class="b">I3</text></g>
  <rect x="447" y="332" width="280" height="73" rx="8" fill="#f2ecf8" stroke="#7750a3" stroke-width="2"/><text x="479" y="360" class="h">replaceable processing-unit slot</text><text x="504" y="385" class="b">radix-2 / local radix-4</text><text x="420" y="430" class="s">K-plane is flow/layout organization; radix is local arithmetic.</text>
  <path d="M778 280H824" class="e"/><text x="784" y="266" class="s">Gather</text>
  <rect x="831" y="112" width="324" height="335" rx="12" fill="#fff4df" stroke="#c58b22" stroke-width="2"/><text x="853" y="145" class="h">3  UB planar · later stages</text><text x="853" y="170" class="b">larger contiguous partner groups</text>
  <g transform="translate(856 205)"><rect x="0" y="0" width="68" height="48" class="r cell"/><rect x="68" y="0" width="68" height="48" class="r cell"/><rect x="136" y="0" width="68" height="48" class="r cell"/><rect x="204" y="0" width="68" height="48" class="r cell"/><text x="20" y="29" class="b">R0</text><text x="88" y="29" class="b">R1</text><text x="156" y="29" class="b">R2</text><text x="224" y="29" class="b">R3</text><rect x="0" y="74" width="68" height="48" class="i cell"/><rect x="68" y="74" width="68" height="48" class="i cell"/><rect x="136" y="74" width="68" height="48" class="i cell"/><rect x="204" y="74" width="68" height="48" class="i cell"/><text x="20" y="103" class="b">I0</text><text x="88" y="103" class="b">I1</text><text x="156" y="103" class="b">I2</text><text x="224" y="103" class="b">I3</text></g>
  <rect x="856" y="350" width="272" height="62" rx="8" fill="#fff" stroke="#d6a13c"/><text x="879" y="377" class="h">continue Ts stage-time loop</text><text x="879" y="399" class="s">no GM write between local stages</text>
  <rect x="45" y="475" width="1110" height="54" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="67" y="499" class="b">Changing the core changes local latency and UB demand; changing the layout changes movement and legal accesses.</text><text x="67" y="519" class="b">They are jointly selected but separately attributed.</text>
</svg>
