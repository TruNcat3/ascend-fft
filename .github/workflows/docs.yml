name: Documentation
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # publish_results.py --check 校验 manifest commit 是 HEAD 的祖先，
          # 浅克隆没有历史对象会把检查变成 "not a valid commit name"。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - name: Run hardware-independent tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check planned long FFT tables
        run: python scripts/generate_long_fft_tables.py --check
      - name: Check published generated artifacts
        run: |
          if test -f results/published/ascend910_9382-cann9.0.0/manifest.json; then
            python scripts/publish_results.py --check
          fi
          if test -f results/published/ascend910_9382-cann9.0.0-v2/manifest.json; then
            python scripts/publish_results.py --check --snapshot ascend910_9382-cann9.0.0-v2
          fi
      - run: mkdocs build --strict
      - name: Check deployed asset links
        run: python scripts/check_docs_assets.py site --site-prefix /ascend-fft/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
